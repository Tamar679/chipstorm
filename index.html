<title>ChipStorm Poker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--text-primary:#F1EFE8;--text-secondary:#B4B2A9;--border-accent:#85B7EB;--bg-accent:#0C447C;--text-accent:#E6F1FB;--fill-primary:#D9AE5B;--on-primary:#412402;--green:#97C459;--red:#E07B6A}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#123128,#0B1512 65%) fixed;color:var(--text-primary);font-family:Heebo,system-ui,sans-serif}
#v{max-width:780px;margin:0 auto;padding:12px}
button{font:inherit;font-size:14px;padding:7px 14px;border-radius:8px;border:1px solid #5F5E5A;background:#2C2C2A;color:var(--text-primary);cursor:pointer;transition:background .15s,transform .08s}
button:hover{background:#444441}button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.pr{background:var(--fill-primary);color:var(--on-primary);border:0;font-weight:700}
button.pr:hover{background:#E5BC69}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.lbl{font-size:14px;color:var(--text-secondary)}
.hint{font-size:13px;color:var(--text-secondary);line-height:1.6}
.cards{direction:ltr;display:inline-block;white-space:nowrap}
[dir=rtl] .mdx{right:auto;left:10px}[dir=rtl] .tb,[dir=rtl] .wheel,[dir=rtl] .mt,[dir=rtl] .rrow input,[dir=rtl] .lad{direction:ltr}[dir=rtl] .achr,[dir=rtl] .bbx,[dir=rtl] .sh{text-align:right}[dir=rtl] .rrow span{text-align:left}
.tb{position:relative;height:500px;background:radial-gradient(ellipse at center,var(--felt,#23794F),#0E2E20 85%);border:14px solid #8A5A1A;border-radius:240px;margin:8px 0;color:#F1EFE8;box-shadow:inset 0 0 40px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.4)}
.st{position:absolute;transform:translateX(-50%);background:rgba(0,0,0,.5);border:2px solid transparent;border-radius:12px;padding:6px 10px;text-align:center;min-width:110px;font-size:13px;z-index:2}
.st.on{border-color:#D9AE5B;box-shadow:0 0 14px rgba(239,159,39,.55)}.st.f{opacity:.45}.st.w{border-color:var(--green);animation:pulse 1.1s ease-in-out 3}
.st .nm{font-weight:600}.st .sty{font-size:10px;color:#9DB8AC;margin-top:-1px}.st .ch{color:#E9C77D}.st .hn{font-size:12px;color:#C0DD97}.st .la{font-size:12px;color:#D3D1C7}
.cd{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:34px;height:48px;background:#fff;color:#2C2C2A;border-radius:5px;margin:1px;font-size:15px;line-height:1.05;font-weight:600;border:1px solid #B4B2A9;vertical-align:middle;font-family:system-ui,sans-serif}
.cd.r{color:#A32D2D}.cd.s{width:22px;height:31px;font-size:11px}.cd.l{width:44px;height:62px;font-size:18px}
.cd.bk{background:var(--cb,repeating-linear-gradient(45deg,#185FA5 0 4px,#1A6BB8 4px 8px));border-color:#85B7EB}.cd.ph{background:transparent;border:1px dashed rgba(255,255,255,.35)}
.cards.ov .cd.s{margin-left:-6px}.cards.ov .cd.s:first-child{margin-left:1px}
.cd.nw{animation:dealIn .38s ease-out both}
.chip{display:inline-block;background:#D9AE5B;color:#412402;border-radius:10px;padding:1px 8px;font-size:12px;margin-top:4px;font-weight:600}
.chip.nw{animation:pop .3s ease-out}
.db{display:inline-block;background:#fff;color:#2C2C2A;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.center{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;z-index:1}
.potv{font-size:15px;margin-bottom:6px;color:#E9C77D;font-weight:600;display:inline-block}.potv.ch{animation:pop .35s}
.hd{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--text-secondary);gap:8px;flex-wrap:wrap}
.hd .hb{display:flex;gap:6px}.hd .hb button{padding:5px 10px}
.msg{min-height:24px;font-size:15px;margin:6px 0;font-weight:500}
.helper{background:#162A23;border:1px solid #335247;border-radius:10px;padding:7px 12px;font-size:13px;margin:6px 0}
.helper b{color:#E9C77D}.helper .good{color:var(--green)}.helper .bad{color:var(--red)}
input[type=range]{accent-color:#D9AE5B}
.lt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;padding-top:.6rem}
.ttl{font-size:26px;font-weight:800}
.wallet{background:#2B2414;border:1px solid #6B5320;border-radius:12px;padding:8px 14px;font-size:15px;display:flex;align-items:center;gap:10px}
.wallet b{color:#E9C77D;font-size:19px}
.feed{font-size:12px;color:var(--text-secondary);margin:8px 0 2px;min-height:18px}
.feed span{margin-right:14px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#E24B4A;margin-right:6px;animation:blink 1.4s infinite}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:6px}
.tc{background:#162A23;border:1px solid #26403A;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s}
.tc:hover{border-color:#D9AE5B}.tc.res{border-color:var(--green);box-shadow:0 0 12px rgba(151,196,89,.4)}
.tch{display:flex;justify-content:space-between;align-items:center}
.tn{font-size:17px;font-weight:700}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#0C447C;color:#E6F1FB}.badge.t{background:#6B3A10;color:#E9C77D}.badge.full{background:#5A1F1F;color:#F3B3AA}
.mt{position:relative;height:60px;background:#1D6B45;border:5px solid #8A5A1A;border-radius:40px;margin:8px 18px}
.sd{position:absolute;width:13px;height:13px;border-radius:50%;background:#D9AE5B;transform:translate(-50%,-50%);border:2px solid #162A23}
.sd.o{background:#162A23;border:2px dashed var(--green)}
.pl div{display:flex;justify-content:space-between;font-size:13px;padding:1px 0;gap:6px}
.pl .tag{font-size:10px;color:#9DB8AC;margin-left:4px}
.pl .open{color:var(--green)}.pl .fullr{color:#F3B3AA}
.tc button.pr{margin-top:auto}
.stats{background:#10201B;border:1px solid #26403A;border-radius:14px;padding:12px 14px;margin-top:16px}
.sth{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.sgrid div{background:#0E1C18;border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}
.sgrid span{font-size:12px;color:var(--text-secondary)}.sgrid b{font-size:17px}
.pos{color:var(--green)}.neg{color:var(--red)}
details.hist{margin-top:14px;background:#10201B;border:1px solid #26403A;border-radius:12px;padding:8px 12px}
details.hist>summary{cursor:pointer;font-weight:600}
details.he{border-top:1px solid #26403A;padding:6px 0;font-size:13px}
details.he summary{cursor:pointer;color:#D3D1C7}
.hbx{padding:6px 4px;line-height:1.9}.hbx .log{color:var(--text-secondary);font-size:12px;margin-top:4px;line-height:1.6}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#D9AE5B;color:#412402;padding:10px 18px;border-radius:10px;font-weight:700;z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:pop .3s}
.sec{margin-top:20px}.sech{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid #26403A;padding-bottom:6px;margin-bottom:8px}.secn{font-size:20px;font-weight:800}
.cd.hi{box-shadow:0 0 0 2px #E9C77D,0 0 14px rgba(250,199,117,.85);transform:translateY(-4px)}.cd.dim{opacity:.4}
details.rk{margin-top:14px;background:#10201B;border:1px solid #26403A;border-radius:12px;padding:8px 12px}details.rk>summary{cursor:pointer;font-weight:600}
.rkr{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:14px;border-top:1px solid #2E2160}.rkr span:first-child{color:#C0DD97}
.keys{font-size:12px;color:#8A8A80;margin-top:-6px}.keys kbd{background:#2C2C2A;border:1px solid #5F5E5A;border-radius:4px;padding:0 5px;font-family:inherit}
button.warn{background:#7A2620;border-color:#E07B6A}

/* ================= ChipStorm card-room design ================= */
:root{--ink:#0B1512;--ink2:#10201B;--ink3:#162A23;--line:#26403A;--line2:#335247;--brass:#D9AE5B;--brass-hi:#F0CF8A;--brass-lo:#A97E2E;--ivory:#F4EFE3;--muted:#9FB5AA;--rd:#C4453A;--mint:#7FCFA0;
 --fill-primary:#D9AE5B;--on-primary:#231803;--text-primary:#F4EFE3;--bg-accent:#2E2610;--border-accent:#D9AE5B;--text-accent:#F0CF8A;--text-secondary:#9FB5AA;--disp:'Suez One',Georgia,'DejaVu Serif',serif;--ui:'Assistant','Heebo','Open Sans',system-ui,sans-serif}
html{background:var(--ink)}
body{background:radial-gradient(1100px 520px at 50% -160px,#183D32 0%,rgba(24,61,50,0) 72%) no-repeat,var(--ink);min-height:100vh;font-family:var(--ui);font-size:15px;color:var(--ivory);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#v{max-width:860px;padding:14px 16px 24px}
.ico{width:20px;height:20px;flex:none;vertical-align:middle}
button{font-family:var(--ui);font-weight:600;border-radius:10px;border:1px solid var(--line2);background:var(--ink3);color:var(--ivory)}
button:hover{background:#1D352D}
button.pr{background:linear-gradient(180deg,#E6BF70,#C6973F);color:var(--on-primary);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 rgba(0,0,0,.35)}
button.pr:hover{background:linear-gradient(180deg,#EEC97C,#D0A24A)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.hint{color:var(--muted)}
/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(16,32,27,.88);border:1px solid var(--line);border-radius:16px;padding:8px 10px 8px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:14px}
.top .me{display:flex;align-items:center;gap:10px;cursor:pointer}.top .pn{font-weight:700;font-size:15px}.top .lv{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.xpb{background:#0E1C18;border-radius:3px;height:4px}.xpb i{background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi))}
.tbr{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.tbr .ib{width:38px;height:38px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:transparent;border:1px solid transparent;color:var(--muted);position:relative}
.tbr .ib:hover{color:var(--ivory);background:var(--ink3)}.tbr .ib.lang{font-size:13px;font-weight:800;width:auto;padding:0 10px;border-color:var(--line)}
.tbr .ib.dotted::after{content:'';position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--brass-hi);box-shadow:0 0 0 2px var(--ink2)}
.tbr .ib .nb{position:absolute;top:2px;right:0;margin:0}
.coins{display:inline-flex;align-items:center;gap:6px;background:#0E1C18;border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 8px;color:var(--brass-hi);margin-inline-end:6px}
.coins b{font-size:15px;font-weight:800}.coins .ico{color:var(--brass)}
.buyb{width:30px;height:30px;padding:0!important;display:inline-flex;align-items:center;justify-content:center;border-radius:50%!important;margin-inline-end:6px}
.av.big{width:42px;height:42px;font-size:24px}
/* hero: a slice of felt with a card fan */
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:230px;padding:30px 36px;border-radius:26px;overflow:hidden;
 background:radial-gradient(ellipse 80% 120% at 70% 50%,#17845C 0%,#0F5A3E 48%,#083323 100%);
 box-shadow:inset 0 0 0 10px #2E1E10,inset 0 0 0 12px rgba(217,174,91,.55),inset 0 0 60px 10px rgba(0,0,0,.45),0 18px 40px rgba(0,0,0,.45)}
.hero-t{position:relative;z-index:1;max-width:58%}
.wm{font-family:var(--disp);font-weight:400;font-size:56px;line-height:1;margin:0 0 8px;color:var(--ivory);letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.tagl{margin:0 0 18px;font-size:17px;color:#D9E7DF;line-height:1.5}
.play{display:inline-flex;align-items:center;gap:10px;font-size:19px;font-weight:800;padding:13px 30px;border-radius:14px}
.play .ico{width:18px;height:18px}
.hero-s{display:block;margin-top:9px;font-size:13px;color:#B9D0C4}
.fan{position:relative;width:250px;height:170px;flex:none}
.fc{position:absolute;left:50%;top:50%;width:96px;height:136px;margin:-68px 0 0 -48px;background:linear-gradient(180deg,#FFFDF7,#EFE8D8);border-radius:11px;border:1px solid #D6CCB6;box-shadow:0 12px 24px rgba(0,0,0,.4);color:#1D1D1B;
 transform:translateX(calc((var(--i) - 1) * 62px)) translateY(calc((var(--i) - 1) * (var(--i) - 1) * 10px)) rotate(calc((var(--i) - 1) * 13deg));transform-origin:50% 120%;font-family:var(--disp)}
.fc.r{color:#B3261E}.fc b{position:absolute;left:9px;top:7px;font-size:26px;line-height:.95;font-weight:400;display:flex;flex-direction:column;align-items:center}.fc b i{font-style:normal;font-size:19px}
.fc em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:54px}
[dir=rtl] .fan{direction:ltr}
/* main destinations */
.dsts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 6px}
.dst{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:start;padding:18px 18px 16px;border-radius:18px;background:linear-gradient(180deg,#152822,#10201B);border:1px solid var(--line);min-height:122px}
.dst:hover{border-color:var(--brass-lo);background:linear-gradient(180deg,#183029,#122520)}
.dst .ico{width:28px;height:28px;color:var(--brass);margin-bottom:6px}
.dst b{font-size:18px;font-weight:800}.dst small{font-size:13px;color:var(--muted);font-weight:500;line-height:1.4}
.dst.ready::after,.rwi.ready::after{content:'';position:absolute;top:14px;inset-inline-end:14px;width:9px;height:9px;border-radius:50%;background:var(--brass-hi);box-shadow:0 0 0 3px rgba(240,207,138,.18)}
/* daily rewards */
.sec{font-size:15px;font-weight:700;color:var(--muted);margin:18px 2px 8px}
.rws{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rwi{position:relative;display:flex;align-items:center;gap:11px;text-align:start;padding:12px 14px;border-radius:14px;background:var(--ink2);border:1px solid var(--line)}
.rwi .ico{width:24px;height:24px;color:var(--muted)}.rwi.ready{border-color:rgba(217,174,91,.55);background:linear-gradient(180deg,#1A2E26,#13241F)}.rwi.ready .ico{color:var(--brass-hi)}
.rwi b{display:block;font-size:14px;font-weight:700}.rwi small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
/* secondary links */
.mrs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.mr{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:transparent;border:1px solid var(--line);color:var(--ivory);font-size:14px}
.mr .ico{width:18px;height:18px;color:var(--brass)}.mr small{color:var(--muted);font-weight:600}.mr .lgb{margin:0}
/* panels */
.panel,.stats{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.two{gap:12px;margin-top:14px}
.sth{font-size:16px;font-weight:800}.sth span{display:inline-flex;align-items:center;gap:7px}.sth .ico{color:var(--brass)}
.sgrid div{background:#0E1C18;border:1px solid #1A302A;border-radius:12px}
.lbr{border-radius:8px;padding:4px 8px}.lbr.me{background:rgba(217,174,91,.13);color:var(--brass-hi)}
.lbt button{border-radius:999px}
details.rk,.hist{background:var(--ink2);border:1px solid var(--line);border-radius:16px}
.crf{color:#5F786E}.crf a{color:#8DA79C}
/* lobby */
.ttl{font-family:var(--disp);font-weight:400;font-size:32px}
.tc{background:linear-gradient(180deg,#152822,#10201B);border:1px solid var(--line);border-radius:18px}
.tc:hover{border-color:var(--brass-lo)}.tn{font-size:18px;font-weight:800}
.badge{background:#1D3530;color:#CFE0D8}.badge.t{background:#3A2C10;color:var(--brass-hi)}
.wallet{background:#14231E;border-color:var(--line2)}
/* modals & toasts */
.mdc{background:linear-gradient(180deg,#132520,#0E1C18)!important;border:1px solid var(--line2)!important;border-radius:22px!important;box-shadow:0 30px 80px rgba(0,0,0,.6)!important}
.mdc h2{font-family:var(--disp);font-weight:400;font-size:28px;letter-spacing:.3px}
.toast{background:#1A2E27!important;border:1px solid var(--line2)!important;color:var(--ivory)!important;border-radius:12px!important}
.helper{background:#13241F;border-color:var(--line2)}
/* table */
.tb:not(.td){background:radial-gradient(ellipse 70% 60% at 50% 45%,#18845C 0%,var(--felt,#0F5A3E) 50%,#06301F 100%);border:18px solid #2E1E10;
 box-shadow:inset 0 0 0 3px rgba(217,174,91,.45),inset 0 0 70px rgba(0,0,0,.5),0 0 0 2px #4A3219,0 22px 50px rgba(0,0,0,.55)}
.st{background:none!important;border:0!important;box-shadow:none!important;padding:0;min-width:120px;animation:none!important}
.st .sh{display:flex;flex-direction:column;align-items:center;gap:0;text-align:center}
.st .av{width:50px;height:50px;font-size:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#2E5A4C,#10241D);border:2px solid #3E6155;box-shadow:0 4px 10px rgba(0,0,0,.4);position:relative;z-index:1}
.st .sh>div{background:rgba(7,16,13,.92);border:1px solid #2F4B42;border-radius:11px;padding:6px 14px 4px;margin-top:-9px;min-width:108px;box-shadow:0 6px 14px rgba(0,0,0,.35)}
.st .nm{font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;gap:5px}.st .ch{color:var(--brass-hi);font-weight:800;font-size:14px}
.st.on .sh>div{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 22px rgba(217,174,91,.45)}.st.on .av{border-color:var(--brass)}
.st.w .sh>div{border-color:var(--mint);box-shadow:0 0 0 1px var(--mint),0 0 24px rgba(127,207,160,.5)}.st.f{opacity:.5}
.st .sty{color:#8FA99E;font-size:11px;margin-top:3px}.st .hn{color:var(--mint);font-weight:700}
.st.me .av{width:56px;height:56px}
.tmr{background:rgba(255,255,255,.12);height:4px}.tmr i{background:linear-gradient(90deg,var(--brass-lo),var(--brass-hi))}
.db{background:#F4EFE3;color:#1D1D1B;box-shadow:0 1px 3px rgba(0,0,0,.5);width:18px;height:18px;line-height:18px;font-size:10px}
.act{font-weight:700;letter-spacing:0;border-radius:6px;font-size:11px}
.act.fold{background:#22322D;color:#AFC2B9}.act.check{background:#1F3B4A;color:#CFE6F2}.act.call{background:#1F4A36;color:#C9F0D9}.act.raise{background:#3B2E12;color:var(--brass-hi)}.act.allin{background:#5A1D18;color:#FFD9D2}
.chip{background:rgba(7,16,13,.85);color:var(--brass-hi);border:1px solid #3A5A4F;font-weight:700}
.potv{background:rgba(7,16,13,.55);border:1px solid rgba(217,174,91,.35);padding:4px 14px;border-radius:999px;color:var(--brass-hi);font-weight:800}
/* cards: ivory with a corner index */
.cd{background:linear-gradient(180deg,#FFFDF7,#F0E9DA);border:1px solid #CBC1AA;border-radius:6px;color:#1D1D1B;font-family:var(--ui);font-weight:800;box-shadow:0 2px 5px rgba(0,0,0,.35);position:relative;overflow:hidden}
.cd.r{color:#B3261E}
.cd:not(.s):not(.bk):not(.ph){align-items:flex-start;justify-content:flex-start;padding:3px 0 0 5px;line-height:.95}
.cd:not(.s):not(.bk):not(.ph)>span{font-size:.72em}
.cd:not(.s):not(.bk):not(.ph)::after{content:attr(data-s);position:absolute;right:4px;bottom:1px;font-size:1.35em;line-height:1}
.cd{width:40px;height:56px;font-size:16px}.cd.l{width:58px;height:82px;font-size:22px;border-radius:8px}
.cd.bk{border:2px solid #F4EFE3;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.cd.ph{background:rgba(0,0,0,.12);border:1px dashed rgba(244,239,227,.25);box-shadow:none}
.cd.hi{box-shadow:0 0 0 2px var(--brass-hi),0 0 16px rgba(240,207,138,.6)}
/* action buttons */
.ab{min-width:122px;height:56px;border-radius:13px;font-size:17px;font-weight:800;letter-spacing:0;border:1px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 18px rgba(0,0,0,.35)}
.ab.fold{background:#16241F;border-color:#4A2E2A;color:#F0A39A}
.ab.call{background:linear-gradient(180deg,#FBF7EC,#E4DCC8);color:#14211C}
.ab.raise{background:linear-gradient(180deg,#E6BF70,#C3923C);color:#231803}
.ab.allin{background:linear-gradient(180deg,#B83A30,#8A231B);color:#FFF4EE}
.ab small{opacity:.8}
.chat button,.pa,.rpre button{background:transparent;border-color:var(--line)}
.rpanel{background:var(--ink2);border-color:var(--line2)}
.hd{color:var(--muted)}.hd b{color:var(--ivory)}
@media(max-width:700px){
 .hero{flex-direction:column;align-items:flex-start;padding:24px 22px 18px;min-height:0}.hero-t{max-width:100%}
 .wm{font-size:44px}.hero{padding-bottom:22px}.fan{position:absolute;right:-6px;bottom:-22px;top:auto;width:250px;height:170px;transform:scale(.5);transform-origin:bottom right;opacity:.9;z-index:0}
 [dir=rtl] .fan{right:auto;left:-6px;transform-origin:bottom left}
 .hero-s{max-width:60%}
 .dsts{grid-template-columns:1fr 1fr 1fr;gap:8px}.dst{padding:13px 11px;min-height:0;border-radius:15px}.dst b{font-size:15px}.dst small{font-size:11.5px}.dst .ico{width:24px;height:24px;margin-bottom:2px}
 .rws{grid-template-columns:1fr 1fr;gap:8px}.rwi{padding:10px 11px}
 .top{padding:7px 8px}.tbr .ib{width:34px;height:34px}.tbr .ib .ico{width:19px;height:19px}
 .st{min-width:84px}.st .av{width:38px;height:38px;font-size:21px}.st .sh>div{min-width:78px;padding:5px 8px 3px}.st.me .av{width:44px;height:44px}
 .cd{width:30px;height:42px;font-size:13px}.cd.l{width:44px;height:62px;font-size:18px}

}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* polish pass 2 */

.tc{display:flex;flex-direction:column;padding:16px}.tc>button{margin-top:auto;width:100%}
.tsub{color:var(--muted);font-size:13px;margin:2px 0 10px}

.sa.o{background:transparent;border:1.5px dashed #3E6155}
.tseats small{color:var(--muted);font-size:12.5px;margin-inline-start:6px;white-space:nowrap}.tseats small.n{margin-inline-start:auto;color:var(--ivory);font-weight:700}
.tc.res{border-color:var(--brass)}

.row>button,.row>.pr{border-radius:999px}
@media(max-width:520px){.top{flex-wrap:nowrap}.tbr{flex-wrap:nowrap}.tbr .ib.opt{display:none}.top .xpb{display:none}.coins{padding:4px 10px 4px 7px;margin-inline-end:2px}.coins b{font-size:14px}.top .pn{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .tst b{font-size:14px}.hd{font-size:12.5px}}

.buy.want{background:linear-gradient(180deg,#FF7AA8,#D8407F);color:#fff;border:0;font-weight:800;padding:8px 10px;border-radius:10px;cursor:pointer}.wpr{display:block;margin-top:4px;color:var(--muted)}
.psw{width:22px;height:30px;border-radius:5px;display:inline-block;border:1px solid rgba(255,255,255,.18)}
.psw.fr{width:24px;height:24px;border-radius:50%;margin-top:3px}
.inst{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:14px}.inst span{flex:none;width:22px;height:22px;border-radius:50%;background:#D9AE5B;color:#0B1512;font-weight:800;display:grid;place-items:center;font-size:12px}
body{padding-top:env(safe-area-inset-top)}
.spm{font:400 72px/1 'Suez One',serif;color:#F0CF8A;margin:18px 0 6px;transition:transform .25s}.spm.hit{transform:scale(1.25);text-shadow:0 0 24px rgba(240,207,138,.6)}
.clubh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border:1px solid #335247;border-radius:10px;background:#162A23;margin-bottom:4px}

/* game rail */
.grail{margin:6px 0 4px}.grh{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}.grh h2{font:400 22px/1.1 'Suez One',serif;color:var(--ivory);margin:0}
.gnav{display:flex;gap:6px}.gnav button{width:34px;height:34px;border-radius:50%;padding:0;font-size:20px;line-height:1;background:var(--ink3);border:1px solid var(--line2);color:var(--ivory)}
@media(hover:none){.gnav{display:none}}
.gtrack{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}.gtrack::-webkit-scrollbar{display:none}
.gcard{--a:#7A1024;--b:#C8322E;--rb:#F0CF8A;flex:0 0 212px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:linear-gradient(165deg,var(--b),var(--a) 70%);border:2px solid rgba(240,207,138,.55);box-shadow:0 14px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18);min-height:318px;isolation:isolate}

.gart{height:128px;display:grid;place-items:center;position:relative}
.gbody{padding:0 14px;text-align:center;flex:1}.gbody h3{margin:0 0 3px;font:400 23px/1.1 'Suez One',serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}.gbody small{color:rgba(255,255,255,.82);font-size:12.5px}
.gplay{margin:10px 12px 4px;padding:11px 8px;border-radius:12px;border:0;background:linear-gradient(180deg,#5FD68A,#239B55);color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 0 #156B39,0 8px 14px rgba(0,0,0,.3);text-shadow:0 1px 0 rgba(0,0,0,.25)}

.gfr{--a:#4A0E3A;--b:#D8407F}.gfa{display:flex;direction:ltr;padding-left:14px}.gfr h3{font-size:20px}.gfa i{font-style:normal;font-size:30px;width:50px;height:50px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE1EE,#F49AC1);border:3px solid #FFF1C1;margin-inline-start:-14px;box-shadow:0 6px 12px rgba(0,0,0,.35);animation:gbob 2.4s ease-in-out infinite;animation-delay:calc(var(--k)*.3s)}@keyframes gbob{50%{transform:translateY(-6px)}}

.gom{--a:#5A1F05;--b:#D8731F}.gsp{--a:#26105A;--b:#8A44E8}.gsn{--a:#0B2E4A;--b:#1F86C2}.gbo{--a:#08301F;--b:#1E8E5C}.gdc{--a:#121B45;--b:#3B57C8}
.gmc{position:relative;width:150px;height:110px;direction:ltr}.gmc i{position:absolute;left:50%;top:50%;width:62px;height:88px;margin:-44px 0 0 -31px;background:linear-gradient(180deg,#FFFDF7,#EDE5D3);border-radius:8px;border:1px solid #D6CCB6;box-shadow:0 8px 16px rgba(0,0,0,.4);color:#1D1D1B;font-style:normal;transform:rotate(calc(var(--k)*13deg)) translate(calc(var(--k)*22px),calc(var(--k)*var(--k)*4px));transform-origin:50% 120%}
.gmc i.r{color:#B3261E}.gmc b{position:absolute;left:7px;top:4px;font:800 19px/1 Assistant,sans-serif}.gmc em{position:absolute;inset:auto 0 9px;text-align:center;font-style:normal;font-size:34px;line-height:1}
.gx{font:400 54px/1 'Suez One',serif;color:#FFE29A;text-shadow:0 0 18px rgba(255,200,90,.7),0 3px 0 #5A2A00;position:relative;z-index:1}
.gxr{position:absolute;width:120px;height:120px;border-radius:50%;background:conic-gradient(#FF5E7E 0 60deg,#FFB347 0 120deg,#5FD68A 0 180deg,#5AB8FF 0 240deg,#B07BFF 0 300deg,#FFE29A 0 360deg);opacity:.35;animation:gspin 14s linear infinite;mask:radial-gradient(circle,transparent 42%,#000 43%)}

const MUS={on:false,iv:0,next:0,bar:0,g:null,
 start(){const a=AC;if(!OPT.music||!OPT.sound||!a||a.state!=='running'||this.on)return;this.on=true;this.g=a.createGain();this.g.gain.value=0;this.g.connect(a.destination);this.g.gain.linearRampToValueAtTime(.55,a.currentTime+2);this.next=a.currentTime+.1;this.iv=setInterval(()=>this.tick(),250)},

 tick(){const a=AC;if(!a||!this.on)return;if(!OPT.music||!OPT.sound||a.state!=='running'){this.stop();return}const beat=60/78;
  // Cmaj9 · Am9 · Dm9 · G13 — soft jazz lounge
  const CH=[[48,[64,67,71,74]],[45,[60,64,67,71]],[50,[65,69,72,76]],[43,[65,69,71,76]]],mf=m=>440*Math.pow(2,(m-69)/12);

const dayKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()};

 if(M.d!==d){M.d=d;M.dp=[0,0,0];M.dc=[0,0,0]}if(M.w!==w){M.w=w;M.wp=[0,0,0];M.wc=[0,0,0]}
 return{M,daily:pickM(MPOOL_D,d*7+3,3),weekly:pickM(MPOOL_W,w*13+5,3)}}

 C[i]=1;const r=misReward(wk);WALLET+=LGp(r);saveP();save();addXP(wk?150:30);toast(`🎯 +${short(r)} chips`);SND.win();openMissions();soft()}

function mulberry32(a){a=a>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
const DPRIZE=[100000,40000,15000];
const DAILY={id:'daily',name:'Daily Challenge',type:'holdem',tour:true,fee:0,every:4,names:[]};
function dcToday(){const d=dayKey();return PROF.dc&&PROF.dc.day===d?PROF.dc:null}
function startDaily(){const d=dayKey();if(dcToday()){openDaily();return}const r=seeded(d*31+7);
 DAILY.seats=[0,1,2,3].map(()=>({name:POOL[r()*POOL.length|0],style:STYK[r()*STYK.length|0],chips:1500}));
 const seen=new Set();DAILY.seats.forEach(x=>{while(seen.has(x.name))x.name=POOL[(POOL.indexOf(x.name)+1)%POOL.length];seen.add(x.name)});
 PROF.dc={day:d,place:0,hands:0};saveP();mis('daily');closeModal();startGame(DAILY,1500,{daily:true,dseed:d,dealer:DAILY.seats.length});toast('📅 Daily Challenge — everyone plays the same cards today')}

 G.msg+=` · Daily Challenge: ${ord(place)} place${pz?` — +${fmt(pz)} 💰`:''}`}

 const me=dcToday();if(me&&me.place)rows.push({n:esc(PROF.name),av:PROF.av,p:me.place,h:me.hands,me:1});return rows.sort((a,b)=>a.p-b.p||b.h-a.h)}

 R.onPeers(ch=>{const me=ch.peers.find(p=>p.sameTab);if(me)MYLP=me.peer;const prev=ONLINE.map(p=>p.peer+JSON.stringify(p.presence)).join('|');

  if(ONLINE.map(p=>p.peer+JSON.stringify(p.presence)).join('|')!==prev){if(VIEW==='home'&&!MDK)renderHome();if(MDK==='online')openOnline()}},()=>{});

function sfc32(a,b,c,d){return()=>{a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11);d=d+1|0;t=t+d|0;c=c+t|0;return(t>>>0)/4294967296}}

function fairDeal(seed,order,h,boardLen){const RNG=rngFromHex(seed),deck=FULL.map(c=>({...c}));for(let i=deck.length-1;i>0;i--){const j=RNG()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]]}
 const holes=order.map(()=>[]);for(let k=0;k<h;k++)order.forEach((live,i)=>{if(live)holes[i].push(deck.pop())});const board=[];
 if(boardLen>=3){deck.pop();board.push(deck.pop(),deck.pop(),deck.pop())}if(boardLen>=4){deck.pop();board.push(deck.pop())}if(boardLen>=5){deck.pop();board.push(deck.pop())}return{holes,board}}
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.some(y=>y.r===x.r&&y.s===x.s));

// ---------- secure deal ("mental poker", SRA commutative encryption) ----------
// Every real player encrypts and shuffles the whole deck with a private key, one after another. To see a card,
// every OTHER player must remove their lock first — so nobody, the host included, can read another player's cards.
// At showdown everyone reveals their key for that hand and the host checks every shown card against the locked deck.
const SPR=BigInt('0x94e94f8b3b9c1221b0e7edee157c235dcb4bb4c169cfc93d2b14d75da6fefc5b'),SPR1=SPR-1n;
function mpow(b,e){let r=1n;b%=SPR;while(e>0n){if(e&1n)r=r*b%SPR;b=b*b%SPR;e>>=1n}return r}
function minv(a,m){let o=a,r=m,os=1n,s=0n;while(r){const q=o/r;[o,r]=[r,o-q*r];[os,s]=[s,os-q*s]}return o===1n?((os%m)+m)%m:null}
function rndBig(){const b=crypto.getRandomValues(new Uint8Array(32));let x=0n;for(const v of b)x=(x<<8n)|BigInt(v);return x}
const rndInt=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
function newKey(){for(;;){let e=rndBig()%SPR1;if(e<3n)continue;if(!(e&1n))e+=1n;const d=minv(e,SPR1);if(d)return{e,d}}}
const CODE=[...Array(52)].map((_,i)=>mpow(BigInt(i+2),2n)),CODEIX=new Map(CODE.map((v,i)=>[v.toString(16),i]));
const hexOk=s=>typeof s==='string'&&/^[0-9a-f]{1,64}$/.test(s)&&BigInt('0x'+s)<SPR;
const h2b=s=>BigInt('0x'+s),b2h=x=>x.toString(16),cardIx=i=>({r:Math.floor(i/4)+2,s:i%4}),ixCard=c=>(c.r-2)*4+c.s;
let MPK=null;const myKey=hn=>{if(!MPK||MPK.hn!==hn)MPK={hn,key:newKey()};return MPK.key};
function encShuffle(deck,key){const out=deck.map(h=>b2h(mpow(h2b(h),key.e)));for(let i=out.length-1;i>0;i--){const j=rndInt(i+1);[out[i],out[j]]=[out[j],out[i]]}return out}
const peel=(h,key)=>b2h(mpow(h2b(h),key.d));
const secHumans=()=>G.P.filter(p=>p.human||(p.remote&&!p.out&&!p.gone)); // the host always takes part (it deals), even when sitting out
// host: run one step around the other players and wait for the last one to answer
function secChain(t,payload,chain,hn){return new Promise((res,rej)=>{if(!chain.length){res(payload);return}
 const w={t:t+'d',hn,res,rej};w.timer=setTimeout(()=>{if(PT.wait===w){PT.wait=null;rej(new Error('timeout'))}},12000);PT.wait=w;
 PT.room.emit('pt.mp',Object.assign({t,hn,order:chain,i:0},payload)).catch(()=>{})})}
async function secDeal(h){const hn=G.handNo,order=secHumans().map(p=>p.sid),key=myKey(hn);
 let deck=encShuffle(CODE.map(b2h),key);deck=(await secChain('sh',{deck},order.slice(1),hn)).deck;
 if(!Array.isArray(deck)||deck.length!==52||!deck.every(hexOk))throw new Error('bad deck');
 G.sec={hn,F:deck,ptr:51};const items=[],who=[];
 for(let k=0;k<h;k++)G.P.forEach(p=>{if(!p.out){const ix=G.sec.ptr--;const own=p.style||p.human?0:p.sid;items.push([ix,own,own===0?deck[ix]:peel(deck[ix],key)]);who.push(p)}});

  if(it[1]===0){const c=CODEIX.get(peel(it[2],key));if(c==null)throw new Error('bad card');p.hole.push(cardIx(c))}
  else{p.hole.push({r:2,s:0});p.ph=true;(p.hix=p.hix||[]).push(it[0]);remote.push(it)}});

async function secBoard(n){const hn=G.handNo,key=myKey(hn),S=G.sec;S.ptr--;const ix=[];for(let i=0;i<n;i++)ix.push(S.ptr--);
 const items=ix.map(i=>[i,-1,peel(S.F[i],key)]);const order=secHumans().map(p=>p.sid);

async function secReveal(){const hn=G.handNo,live=G.P.filter(p=>p.remote&&!p.folded&&p.ph);if(!live.length)return;

function secClient(m){const d=m.data||{},hn=+d.hn;if(!PT.sid&&PT.sid!==0)return;

  PT.room.emit('pt.mp',{t:'rv',hn,e:b2h(MPK.key.e),hole:need&&PT.hole&&PT.hole.hn===hn?PT.hole.c.map(ixCard):[]}).catch(()=>{})}}

// ---------- free season pass: 30 levels a month ----------
const SPLV=30,SPXP=40;
function spNow(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)}
function spOf(){const id=spNow();if(!PROF.sp||PROF.sp.id!==id)PROF.sp={id,xp:0,cl:[]};return PROF.sp}
const spLvl=()=>Math.min(SPLV,Math.floor(spOf().xp/SPXP)+1);
function spReward(l){if(l===10)return{cos:['frame','seasonx'],t:'Season Star frame'};if(l===20)return{cos:['back','seasonb'],t:'Season Stars cards'};if(l===30)return{cos:['felt','seasonf'],t:'Season Night felt'};return{chips:l*600,t:short(l*600)+' chips'}}
function spXP(n){if(G&&(G.practice||G.client))return;const sp=spOf(),before=spLvl();sp.xp+=n;const after=spLvl();saveP();if(after>before)setTimeout(()=>toast(`🎟 Season level ${after}! Claim your reward`),900)}
function spClaim(l){const sp=spOf();if(l>spLvl()||sp.cl.includes(l))return;const r=spReward(l);sp.cl.push(l);if(r.chips){WALLET+=LGp(r.chips)}if(r.cos){const own=cosOwned();if(!own.includes(r.cos[1]))own.push(r.cos[1])}saveP();save();toast(`🎟 ${r.t}`);SND.win();openSeason();soft()}
function spClaimAll(){const sp=spOf();for(let l=1;l<=spLvl();l++)if(!sp.cl.includes(l)){const r=spReward(l);sp.cl.push(l);if(r.chips)WALLET+=LGp(r.chips);if(r.cos){const own=cosOwned();if(!own.includes(r.cos[1]))own.push(r.cos[1])}}saveP();save();SND.win();openSeason();soft()}
const spReady=()=>{const sp=spOf();let n=0;for(let l=1;l<=spLvl();l++)if(!sp.cl.includes(l))n++;return n};
function openSeason(){const sp=spOf(),lv=spLvl(),into=sp.xp%SPXP,end=new Date();end.setMonth(end.getMonth()+1,1);end.setHours(0,0,0,0);const days=Math.ceil((end-Date.now())/864e5);
 modal(`<h2>🎟 Season pass</h2><div class="hint">Free for everyone. Play hands to earn XP: +1 per hand, +3 per pot you win, +25 for a tournament win. New season every month.</div><div class="hint">Season ends in ${days} days</div>
 <div class="spbar"><b>Level ${lv}${lv>=SPLV?' · MAX':''}</b><div class="gpr"><span style="width:${lv>=SPLV?100:Math.round(into/SPXP*100)}%"></span></div><small>${lv>=SPLV?'Season complete!':`${into}/${SPXP} XP to level ${lv+1}`}</small></div>
 ${spReady()?`<button class="pr" style="margin:8px 0" onclick="spClaimAll()">Claim all (${spReady()})</button>`:''}
 <div class="sptrack">${Array.from({length:SPLV},(_,i)=>{const l=i+1,r=spReward(l),got=sp.cl.includes(l),open=l<=lv;return `<div class="spl ${got?'got':open?'open':''} ${r.cos?'big':''}"><span class="spn">${l}</span><span class="spr">${r.cos?'🎁 ':''}${r.t}</span>${got?'<span class="spc">✓</span>':open?`<button class="pr" onclick="spClaim(${l})">Claim</button>`:'<span class="spc">🔒</span>'}</div>`}).join('')}</div>`,'season')}

function trS(s){if(LANG!=='he'||s==null)return s;const m=String(s).match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core||!/[A-Za-z]/.test(core))return s;const one=c=>{if(HE[c]!=null)return HE[c];for(const[r,f] of HE_RX)if(r.test(c))return c.replace(r,f);return null};
